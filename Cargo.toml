[package]
name = "kestreldb"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
object_store = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.29.1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
